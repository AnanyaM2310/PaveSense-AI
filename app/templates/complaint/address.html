{% extends "layout/base.html" %}

{% block title %}
Address Details | PaveSense AI
{% endblock %}

{% block content %}

<section class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <!-- Progress -->

            <div class="mb-5">

                <div class="progress" style="height: 10px;">

                    <div
                        class="progress-bar bg-success"
                        style="width: 37.5%;">
                    </div>

                </div>

                <p class="mt-2 text-muted">
                    Step 3 of 8 • Address Details
                </p>

            </div>


            <!-- Address Card -->

            <div class="feature-card">

                <h2 class="text-center mb-5">
                    📍 Address Details
                </h2>


                <form
                    action="{{ url_for('complaint.address') }}"
                    method="POST"
                >

                    <!-- Country -->

                    <div class="mb-4">

                        <label
                            for="country"
                            class="form-label"
                        >
                            Country
                        </label>

                        <input
                            type="text"
                            id="country"
                            name="country"
                            class="form-control"
                            placeholder="Enter country"
                            value="{{ complaint.country or '' }}"
                            required
                        >

                    </div>


                    <!-- State -->

                    <div class="mb-4">

                        <label
                            for="state"
                            class="form-label"
                        >
                            State
                        </label>

                        <input
                            type="text"
                            id="state"
                            name="state"
                            class="form-control"
                            placeholder="Enter state"
                            value="{{ complaint.state or '' }}"
                            required
                        >

                    </div>


                    <!-- District -->

                    <div class="mb-4">

                        <label
                            for="district"
                            class="form-label"
                        >
                            District
                        </label>

                        <input
                            type="text"
                            id="district"
                            name="district"
                            class="form-control"
                            placeholder="Enter district"
                            value="{{ complaint.district or '' }}"
                            required
                        >

                    </div>


                    <!-- Local Body -->

                    <div class="mb-4">

                        <label
                            for="local_body"
                            class="form-label"
                        >
                            Local Body
                        </label>

                        <input
                            type="text"
                            id="local_body"
                            name="local_body"
                            class="form-control"
                            placeholder="Enter local body"
                            value="{{ complaint.local_body or '' }}"
                            required
                        >

                    </div>


                    <!-- Ward -->

                    <div class="mb-4">

                        <label
                            for="ward"
                            class="form-label"
                        >
                            Ward
                        </label>

                        <input
                            type="text"
                            id="ward"
                            name="ward"
                            class="form-control"
                            placeholder="Enter ward number"
                            value="{{ complaint.ward or '' }}"
                            required
                        >

                    </div>


                    <!-- House Number -->

                    <div class="mb-4">

                        <label
                            for="house_no"
                            class="form-label"
                        >
                            House Number
                        </label>

                        <input
                            type="text"
                            id="house_no"
                            name="house_no"
                            class="form-control"
                            placeholder="Enter house number"
                            value="{{ complaint.house_no or '' }}"
                        >

                    </div>


                    <!-- Post Office -->

                    <div class="mb-4">

                        <label
                            for="post_office"
                            class="form-label"
                        >
                            Post Office
                        </label>

                        <input
                            type="text"
                            id="post_office"
                            name="post_office"
                            class="form-control"
                            placeholder="Enter post office"
                            value="{{ complaint.post_office or '' }}"
                            required
                        >

                    </div>


                    <!-- Pincode -->

                    <div class="mb-5">

                        <label
                            for="pincode"
                            class="form-label"
                        >
                            Pincode
                        </label>

                        <input
                            type="text"
                            id="pincode"
                            name="pincode"
                            class="form-control"
                            placeholder="Enter pincode"
                            maxlength="6"
                            value="{{ complaint.pincode or '' }}"
                            required
                        >

                    </div>


                    <!-- Navigation -->

                    <div class="d-flex justify-content-between">

                        <a
                            href="{{ url_for('complaint.applicant') }}"
                            class="btn btn-outline-secondary"
                        >
                            ← Previous
                        </a>

                        <button
                            type="submit"
                            class="btn btn-success px-5"
                        >
                            Next →
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</section>

{% endblock %}
